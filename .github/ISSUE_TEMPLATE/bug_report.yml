name: Fehlerbericht
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert?
      description: Beschreibe den Fehler und was du stattdessen erwartet hast.
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Welt mit … öffnen
        2. Verbinden
        3. …
    validations:
      required: true
  - type: input
    id: mud
    attributes:
      label: MUD (Host/Port) und Zeichensatz
      placeholder: mg.mud.de:4711, Latin-1
  - type: input
    id: version
    attributes:
      label: rustmud-Version und Betriebssystem
      placeholder: 0.0.1, Windows 11
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log, Skript oder Welt-Datei (optional)
      description: Bitte Passwörter und andere private Daten vorher entfernen.
      render: text
