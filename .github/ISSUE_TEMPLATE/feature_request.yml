name: Funktionswunsch
description: Eine Idee für eine neue Funktion
labels: [enhancement]
body:
  - type: textarea
    id: wunsch
    attributes:
      label: Was wünschst du dir?
    validations:
      required: true
  - type: textarea
    id: nutzen
    attributes:
      label: Wofür brauchst du das?
      description: Gibt es das z. B. in MUSHclient oder Mudlet? Wie wird es dort benutzt?
