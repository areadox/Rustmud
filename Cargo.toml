[package]
name = "rustmud"
version = "0.1.0"
edition = "2021"
description = "MUD-Client in Rust nach dem Vorbild von MUSHclient"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.31"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
regex = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
directories = "5"
encoding_rs = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
