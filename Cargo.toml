[package]
name = "rustmud"
version = "0.0.3"
edition = "2021"
description = "MUD-Client in Rust nach dem Vorbild von MUSHclient – Telnet, MCCP, GMCP, MSDP, Trigger, Aliase, Timer und Lua-Scripting"
license = "MIT"
authors = ["areadox"]
repository = "https://github.com/areadox/Rustmud"
homepage = "https://github.com/areadox/Rustmud"
readme = "README.md"
keywords = ["mud", "telnet", "client", "lua", "mushclient"]
categories = ["games", "network-programming", "gui"]
exclude = [".github/", "target/", "installer/"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.31"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
regex = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
jiff = "0.2"
directories = "5"
encoding_rs = "0.8"
ureq = { version = "2", features = ["json", "native-certs"] }
rfd = "0.15"
egui_dock = { version = "0.16", features = ["serde"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
